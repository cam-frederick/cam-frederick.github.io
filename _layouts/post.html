---
layout: default
---

<main class="container">
  <article class="post">
    <header class="post-header">
      <div class="post-meta">
        <span class="mono">{{ page.date | date: "%B %-d, %Y" }}</span>
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <footer class="post-footer">
      <a href="/blog/" class="mono back-link">← All posts</a>
    </footer>
  </article>
</main>
