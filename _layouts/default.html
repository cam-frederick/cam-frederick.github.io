<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} — Cam Frederick</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}" />{% endif %}
    <meta property="og:title" content="{{ page.title }} — Cam Frederick" />
    {% if page.description %}<meta property="og:description" content="{{ page.description }}" />{% endif %}
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{ page.image | absolute_url }}" />{% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav class="topbar">
      <a href="/" class="topbar-brand mono">Cam Frederick</a>
      <div class="topbar-links">
        <a href="/#work" class="topbar-link mono">Work</a>
        <a href="/#projects" class="topbar-link mono">Projects</a>
        <a href="/blog/" class="topbar-link mono">Blog</a>
        <a href="/#links" class="topbar-link mono">Links</a>
      </div>
      <button class="hamburger" id="hamburger" aria-expanded="false" aria-controls="mobileNav" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>
    </nav>
    <div class="mobile-nav" id="mobileNav" aria-hidden="true">
      <a href="/#work" class="mobile-nav-link mono">Work</a>
      <a href="/#projects" class="mobile-nav-link mono">Projects</a>
      <a href="/blog/" class="mobile-nav-link mono">Blog</a>
      <a href="/#links" class="mobile-nav-link mono">Links</a>
    </div>
    <script>
      const hamburger = document.getElementById('hamburger');
      const mobileNav = document.getElementById('mobileNav');
      hamburger.addEventListener('click', function() {
        const open = mobileNav.classList.toggle('mobile-nav--open');
        hamburger.classList.toggle('hamburger--open', open);
        hamburger.setAttribute('aria-expanded', open);
        mobileNav.setAttribute('aria-hidden', !open);
      });
      mobileNav.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
          mobileNav.classList.remove('mobile-nav--open');
          hamburger.classList.remove('hamburger--open');
          hamburger.setAttribute('aria-expanded', false);
          mobileNav.setAttribute('aria-hidden', true);
        });
      });
    </script>

    {{ content }}

  </body>
</html>
